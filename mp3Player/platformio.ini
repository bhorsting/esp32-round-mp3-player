; ESP32-S3-Touch-LCD-1.85 — Waveshare Arduino mp3Player sketch
; https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-1.85
;
; SquareLine must export ONLY into ui_export/ (see SquareLine_Project.slp).
; Never set the SquareLine export folder to this directory root — that wipes firmware.

[platformio]
src_dir = .
lib_dir = lib
include_dir = include

[env:waveshare_s3_1_85]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.maximum_size = 16777216
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-I${PROJECT_DIR}/include
	-I${PROJECT_DIR}
	-I${PROJECT_DIR}/ui_export
build_src_filter =
	+<*>
	+<ui_export/>
	-<Wireless.cpp>
	; SquareLine 1.6 sometimes emits LVGL9 image C — keep LVGL8 copies instead
	-<ui_export/ui_img_711420211.c>
	-<ui_export/ui_img_239613141.c>
	-<ui_export/ui_img_1691442077.c>
	-<ui_export/ui_img_389595065.c>
	-<ui_export/ui_img_911376565.c>
	-<ui_export/ui_img_izrezak2_png.c>
	-<ui_export/ui_img_izrezak_png.c>
	; Screen2 decorative PNG unused (cover art is runtime ID3)
	-<lib/>
	-<include/>
	-<assets/>
	-<autosave/>
	-<backup/>
	-<cache/>
	-<components/>
	-<.pio/>
lib_ldf_mode = chain
lib_compat_mode = soft
lib_deps =
	Wire
	FS
	SD_MMC
	SPI
	SPIFFS
	FFat
	SD
	WiFi
	Network
	NetworkClientSecure
	ESP32Time
	bitbank2/JPEGDEC
	bitbank2/AnimatedGIF
